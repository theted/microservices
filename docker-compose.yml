# One gateway in front of a pile of languages that each compute one Collatz step.
# Every service listens on :8000 inside the network; only the gateway is published.

x-shimmed: &shimmed
  additional_contexts:
    shim: ./shim

services:
  gateway:
    image: nginx:1.31-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
      - ./services:/srv/src/services:ro
      - ./shim:/srv/src/shim:ro

  # The originals, rewritten
  go:
    build: ./services/go
  python:
    build: ./services/python
  php:
    build: ./services/php
  csharp:
    build: ./services/csharp
  typescript:
    build: ./services/typescript

  # Esolangs
  arnoldc:
    build: { context: ./services/arnoldc, <<: *shimmed }
  lolcode:
    build: { context: ./services/lolcode, <<: *shimmed }
  shakespeare:
    build: { context: ./services/shakespeare, <<: *shimmed }

  # Retro
  cobol:
    build: { context: ./services/cobol, <<: *shimmed }
  c64basic:
    build: { context: ./services/c64basic, <<: *shimmed }
  forth:
    build: { context: ./services/forth, <<: *shimmed }

  # Not really programming languages
  tex:
    build: { context: ./services/tex, <<: *shimmed }
  sql:
    image: postgrest/postgrest:v16.4
    environment:
      PGRST_DB_URI: postgres://authenticator:hailstone@sql-db:5432/postgres
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_SERVER_PORT: "8000"
    depends_on: [sql-db]
  sql-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: hailstone
    volumes:
      - ./services/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  gawk:
    build: ./services/gawk

  # Mind-benders
  prolog:
    build: ./services/prolog
  apl:
    build: { context: ./services/apl, <<: *shimmed }
  asm:
    build: ./services/asm

  # Lisps
  elisp:
    build: ./services/elisp
  guile:
    build: ./services/guile
  babashka:
    build: ./services/babashka

  # Obviously missing
