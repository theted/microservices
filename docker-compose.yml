# One gateway in front of a pile of languages that each compute one Collatz step.
# Every language image carries the same runner (runner/), the only HTTP server
# here: it listens on :8000 and runs the language's program once per request.

x-language: &language
  additional_contexts:
    runner: service:runner

services:
  gateway:
    image: nginx:1.31-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web:/usr/share/nginx/html:ro
      - ./services:/srv/src/services:ro
      - ./runner:/srv/src/runner:ro

  # Built, never started: every language image copies the runner binary out of it.
  runner:
    build: ./runner
    scale: 0

  # Classic
  go:
    build: { context: ./services/go, <<: *language }
  python:
    build: { context: ./services/python, <<: *language }
  php:
    build: { context: ./services/php, <<: *language }
