# The only published port. Serves the client and fans /svc/<id>/ out to the
# language containers, all of which listen on :8000 inside the compose network.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's DNS, resolved per request: a stopped service is a 502, not a
    # gateway that refuses to start, and new services need no edit here.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.0;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    add_header Cache-Control no-store always;

    # The source viewer: every service's folder and the shim, read-only, as
    # plain text, with JSON directory listings so the client can find the files.
    location /src/ {
        alias /srv/src/;
        autoindex on;
        autoindex_format json;
        types { }
        default_type "text/plain; charset=utf-8";
    }

    # PostgREST serves functions under /rpc/<name>.
    location = /svc/sql/ {
        set $upstream sql;
        proxy_pass http://$upstream:8000/rpc/collatz_step$is_args$args;
    }

    location ~ ^/svc/([a-z0-9-]+)/$ {
        set $upstream $1;
        proxy_pass http://$upstream:8000/$is_args$args;
    }
}
